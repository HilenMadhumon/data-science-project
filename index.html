<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First GitHub Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #e0f2fe, #eef2ff);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 620px);
      padding: 48px 32px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(30, 64, 175, 0.12);
    }
    .tag {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 999px;
      color: #1d4ed8;
      background: #dbeafe;
      font-size: 13px;
      font-weight: bold;
    }
    h1 { margin: 20px 0 12px; font-size: clamp(2rem, 6vw, 3rem); }
    p { color: #64748b; line-height: 1.7; }
    button {
      margin-top: 18px;
      padding: 13px 22px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: #2563eb;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    footer { margin-top: 30px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">MY FIRST GITHUB PROJECT</span>
    <h1>Hello, World! 👋</h1>
    <p>
      Welcome to my demo website. This simple page was created with
      HTML and CSS, and it is ready to be published using GitHub Pages.
    </p>
    <button type="button" onclick="showMessage()">Click Me</button>
    <p id="message" aria-live="polite"></p>
    <footer>Made with HTML &amp; CSS · 2026</footer>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Great! Your demo website is working. 🎉";
    }
  </script>
</body>
</html>
